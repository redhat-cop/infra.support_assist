---
# Pipeline playbook for OCP/RHCOS node SOS Report collection via 'oc debug'.
# Runs on localhost — no SSH access to nodes required; the oc CLI drives all
# interactions with the cluster API and node pods.
- name: "OCP Node SOS Report Pipeline"
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true

  tasks:
    # --- STAGE 00: Preflight ---
    # Validates Red Hat API credentials early so we don't collect reports only
    # to discover the upload will fail.
    - name: "[STAGE 00 - Preflight] | Block: Validate upload prerequisites"
      tags:
        - preflight
      delegate_to: localhost
      run_once: true
      when:
        - upload | default(true) | bool
      block:
        - name: "[STAGE 00 - Preflight] | 0.1) Validate Red Hat API token refresh"
          ansible.builtin.include_role:
            name: infra.support_assist.rh_token_refresh
            tasks_from: 1-pre_validation.yml

        - name: "[STAGE 00 - Preflight] | 0.2) Validate Red Hat Support Case parameters"
          ansible.builtin.include_role:
            name: infra.support_assist.rh_case
            tasks_from: 1-pre_validation.yml

    # --- STAGE 01: Collect ---
    # The role handles the full OCP debug pipeline internally: login, node
    # discovery/validation, per-node SOS generation via support-tools container,
    # fetch via 'oc debug -- cat', and optional cleanup.
    - name: "[STAGE 01 - Collect] | Block: Gather OCP Node SOS Report(s)"
      tags:
        - collect
      block:
        - name: "[STAGE 01 - Collect] | 1.1) Run OCP Node SOS Report (Login, Discover, Collect, Fetch)"
          ansible.builtin.include_role:
            name: infra.support_assist.sos_report
          vars:
            sos_report_mode: "ocp_debug"
      rescue:
        - name: "[STAGE 01 - Collect] | Rescue: OCP Node SOS Report collection failed"
          ansible.builtin.fail:
            msg: >-
              ❌ FAILED! Oh. No! => OCP Node SOS Report execution failed during
              collection or archiving. Stopping pipeline immediately; check the
              logs above for details.

    # --- STAGE 02: Upload ---
    # Refreshes the Red Hat API token and uploads all collected reports to the
    # support case. No host aggregation needed — 'hosts: localhost' means
    # case_updates_needed is already populated directly by the role's loop.
    - name: "[STAGE 02 - Upload] | Block: Upload to Red Hat Support Case"
      tags:
        - upload
      delegate_to: localhost
      run_once: true
      when:
        - upload | default(true) | bool
      block:
        - name: "[STAGE 02 - Upload] | Block: Refresh Red Hat API Token"
          block:
            - name: "[STAGE 02 - Upload] | 2.1) Refresh Red Hat API token"
              ansible.builtin.include_role:
                name: infra.support_assist.rh_token_refresh
          rescue:
            - name: "[STAGE 02 - Upload] | Rescue: Token refresh failed"
              ansible.builtin.fail:
                msg: >-
                  ❌ FAILED! Oh. No! => Refresh Red Hat API token failed.
                  Stopping pipeline immediately; check the logs above for details.

        - name: "[STAGE 02 - Upload] | Block: Create/Update Red Hat Support Case"
          block:
            - name: "[STAGE 02 - Upload] | 2.2) Create or update Red Hat Support Case"
              ansible.builtin.include_role:
                name: infra.support_assist.rh_case
          rescue:
            - name: "[STAGE 02 - Upload] | Rescue: Case creation/update failed"
              ansible.builtin.fail:
                msg: >-
                  ❌ FAILED! Oh. No! => Case creation/update failed.
                  Stopping pipeline immediately; check the logs above for details.
                  Check the API response for invalid subscription or product/version mismatch.
...
