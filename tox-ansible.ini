[tox]
; ignore_base_python_conflict = true
requires =
    tox>=4.47.3

# tox only forwards variables matched by pass_env. tox-ansible adds GITHUB_TOKEN only; without
# this, ANSIBLE_GALAXY_* from CI never reaches ade/ansible-galaxy inside the tox env.
[testenv]
pass_env =
    ANSIBLE_GALAXY_*
    GITHUB_TOKEN

[ansible]

skip =
    py3.7
    py3.8
    py3.9
    py3.10
    py3.11
    2.9
    2.10
    2.11
    2.12
    2.13