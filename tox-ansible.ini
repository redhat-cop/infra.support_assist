[tox]
# Skip validation that parses env name for Python version; env names like
# sanity-py3.14-2.20 contain Ansible version (2.20), which tox misreads as a
# second Python factor and raises "conflicting factors".
ignore_base_python_conflict = true

[ansible]

skip =
    py3.7
    py3.8
    2.9
    2.10
    2.11
    2.12
    2.13

[testenv]
# Explicit base_python prevents tox from mis-parsing Ansible version (e.g. 2.16, 2.20)
# as a Python version factor, which causes "conflicting factors" errors.
base_python =
    py3.10: python3.10
    py3.11: python3.11
    py3.12: python3.12
    py3.13: python3.13
    py3.14: python3.14