---
minor_changes:
  - sos_report - Add ``sos_report_enable_plugins`` (``--enable-plugins``) to
    enable plugins sos does not run by default. In OCP modes they are added to
    the openshift plugins the role always enables.
  - sos_report - Add ``sos_report_label`` (``--label``). Empty (the default)
    keeps the previous behaviour of labelling with the lowercased inventory
    hostname or OCP node name.
  - sos_report - Document the sos CLI option variables (``sos_report_case_id``,
    ``sos_report_skip_plugins``, ``sos_report_only_plugins``, etc.) in the
    role README.
bugfixes:
  - sos_report - Standard and ocp_ssh modes now fetch the exact archive path
    reported by sos instead of searching ``sos_report_tmp_dir`` for archives
    modified in the last 5 minutes, which could miss the report or pick up
    stale archives from earlier runs.
  - sos_report - Cleanup now removes only the archive (and ``.sha256``)
    generated by the current run. Previously every ``sosreport-*.tar.*`` in
    ``sos_report_tmp_dir`` was deleted, including pre-existing reports.
  - sos_report - Recognise ``.tar.gz`` and ``.tar`` archives in all modes so
    ``sos_report_compression_type`` values other than ``xz`` no longer fail
    the "report generated" check.
  - rh_case - Fix the presigned upload HTTP status parsing. The regex was
    double-escaped inside a folded YAML block and never matched, and
    ``regex_search(...) | first`` crashed on empty output before the
    validation step could report the real curl error.
  - rh_case - The presigned upload ``curl`` now honours ``rh_case_use_proxy``
    and ``rh_case_http_proxy`` like the other API calls, and prints errors
    to stderr (``-sS``).
  - rh_case, rh_token_refresh - Cast ``*_use_proxy`` to a boolean so a string
    ``"false"`` passed via ``use_proxy`` is treated as false.
