---
breaking_changes:
  - sos_report - Rename playbook ``sos_report.yml`` to ``sos_report_rhel.yml``.
    A backward-compatible alias at ``playbooks/sos_report.yml`` is provided
    for this release, but will be removed in a future version.
    Migration path - RHEL hosts use ``infra.support_assist.sos_report_rhel``;
    OCP nodes use ``infra.support_assist.sos_report_ocp``.

minor_changes:
  - sos_report - Add three collection modes for OCP/RHCOS nodes -
    ``ocp_ssh`` (SSH via support-tools container) and ``ocp_debug``
    (oc debug node from localhost) in addition to the existing
    ``standard`` mode for RHEL hosts.
  - sos_report - Add auto-discovery of cluster nodes via ``oc get nodes``
    with optional label selector filtering (``sos_report_ocp_node_selector``).
  - sos_report - Add SSH fallback for ``ocp_debug`` mode when
    ``oc debug`` fails on a node, with bastion/ProxyJump support.
  - sos_report - Add 13 new CLI parameter variables mapping to
    ``sos report`` flags - ``--clean``, ``--case-id``, ``--low-priority``,
    ``--since``, ``--only-plugins``, ``--skip-plugins``, ``--log-size``,
    ``--journal-size``, ``--threads``, ``-z``, ``--keywords``,
    ``--domains``, ``--usernames``.
  - sos_report - Add sos version pre-flight check requiring >= 4.0.
  - sos_report - Add per-node disk space pre-flight check before
    SOS collection.
  - sos_report - Add per-node summary report template with collection
    details.
  - sos_report - Restructure tasks into subdirectories by mode
    (``standard/``, ``ocp_ssh/``, ``ocp_debug/``, ``common/``).
  - sos_report - Add ``sos_report_mode`` validation assert that fails
    fast on unrecognised values instead of silently running nothing.
  - sos_report - Wire ``sos_report_case_id`` to fall back to the shared
    ``case_id`` pipeline variable so callers do not need to pass both.
  - sos_report - Enable ``--low-priority`` by default
    (``sos_report_low_priority`` now defaults to ``true``) to reduce I/O
    and CPU impact on target hosts during collection. Override with
    ``-e sos_report_low_priority=false`` to restore previous behavior.
  - sos_report - Add new ``sos_report_ocp.yml`` playbook for OCP node
    collection via ``oc debug``.
