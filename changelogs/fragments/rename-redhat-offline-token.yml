---
minor_changes:
  - rh_token_refresh - Prefer ``redhat_offline_token`` when providing the Red Hat offline
    token. Resolution order is ``redhat_offline_token``, then ``offline_token``, then the
    ``REDHAT_OFFLINE_TOKEN`` environment variable.
deprecated_features:
  - The ``offline_token`` extra-var is deprecated in favor of ``redhat_offline_token``.
    ``offline_token`` remains supported as a fallback for backward compatibility.
