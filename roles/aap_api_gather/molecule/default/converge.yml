---
# Converge runs the full role. Fails without real AAP (connection/auth at gather step).
- name: Converge
  hosts: all
  roles:
    - role: ../..
      vars:
        aap_hostname: "example.com"
        aap_username: "test_user"
        aap_password: "test_password"
        aap_token: "placeholder_token"
        aap_validate_certs: false
        aap_api_gather_components: [controller]
...
