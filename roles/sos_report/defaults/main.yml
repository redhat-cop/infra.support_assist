---
# The destination directory on the Ansible control node to store the reports.
# The `fetch` module will create a subdirectory for each case/host.
sos_report_dest: "/tmp/sos_reports"

sos_report_aap_containerized: "{{ containerized | default(false) | bool }}"

sos_report_cleanup: "{{ clean | default(true) | bool }}"

# --- OCP Node SOS Report Collection ---
# Collection mode: "standard" (default RHEL hosts), "ocp_ssh" (SSH to RHCOS nodes), "ocp_debug" (oc debug node)
# Reference KCS:
#   SSH:      https://access.redhat.com/solutions/3820762
#   oc debug: https://access.redhat.com/solutions/5065411
sos_report_mode: "standard"

# OCP: support-tools container image used by toolbox on RHCOS nodes (both OCP modes).
# Override for disconnected/air-gapped environments pointing to a mirror registry.
sos_report_ocp_support_tools_image: "registry.redhat.io/rhel9/support-tools"

# OCP: path to the container registry auth file on the RHCOS node (both OCP modes).
# RHCOS nodes store the cluster pull secret at /var/lib/kubelet/config.json by default.
# This is required for pulling the support-tools image from registry.redhat.io.
sos_report_ocp_authfile: "/var/lib/kubelet/config.json"

# OCP: include --all-logs flag in the sos report command (both OCP modes).
# Set to false if reports become too large.
sos_report_ocp_all_logs: true

# OCP: plugin timeout in seconds (both OCP modes)
sos_report_ocp_plugin_timeout: 600

# OCP Debug mode only: OpenShift API connection details.
# These fall back to ocp_must_gather variables if available (for combined playbooks).
sos_report_ocp_token: "{{ ocp_must_gather_token | default('') }}"
sos_report_ocp_server_url: "{{ ocp_must_gather_server_url | default('') }}"
sos_report_ocp_validate_ssl: "{{ ocp_must_gather_validate_ssl | default(true) }}"

# OCP Debug mode only: list of specific node names to collect SOS reports from.
# Example: ["worker-0.ocp.example.com", "master-0.ocp.example.com"]
# Leave empty to auto-discover nodes via 'oc get nodes'.
sos_report_ocp_nodes: []

# OCP Debug mode only: Kubernetes label selector to filter which nodes to collect from.
# Used during auto-discovery when sos_report_ocp_nodes is empty.
# Examples:
#   "node-role.kubernetes.io/worker="         - only worker nodes
#   "node-role.kubernetes.io/master="         - only master/control-plane nodes
#   "node-role.kubernetes.io/infra="          - only infra nodes
#   "kubernetes.io/os=linux"                  - all Linux nodes
#   "topology.kubernetes.io/zone=us-east-1a"  - nodes in a specific zone
# Leave empty to collect from ALL nodes.
sos_report_ocp_node_selector: ""

# --- OCP Debug Mode: SSH Fallback ---
# When 'oc debug' fails on a node (e.g. debug pod scheduling issues, API timeouts),
# the role can fall back to SSH-based collection on that specific node.
# This requires SSH connectivity and key-based auth to the RHCOS node(s).
sos_report_ocp_fallback_ssh: false

# SSH user for RHCOS nodes (used only when fallback is triggered).
# RHCOS nodes use 'core' as the default SSH user.
sos_report_ocp_ssh_user: "core"

# Path to the SSH private key for RHCOS node access (used only when fallback is triggered).
# Leave empty to use Ansible's default SSH key resolution (~/.ssh/id_rsa, ssh-agent, etc.).
# In AAP, leave empty — Machine credentials inject the key via ssh-agent automatically.
sos_report_ocp_ssh_key: ""

# Extra SSH arguments appended to ansible_ssh_common_args for the fallback connection.
# Use for bastion/jump host access, custom SSH config, or any environment-specific SSH option.
# Examples:
#   "-o ProxyJump=bastion.example.com"
#   "-o ProxyCommand='ssh -W %h:%p user@bastion.example.com'"
#   "-o Port=2222"
sos_report_ocp_ssh_extra_args: ""

# --- SOS Report CLI Options ---
# These options map directly to 'sos report' CLI flags and apply to all
# collection modes (standard, ocp_ssh, ocp_debug, and SSH fallback).
# Default values preserve the current behavior — empty strings and zeros
# mean "do not pass the flag" (let sos use its own defaults).
#
# ⚠️  Minimum sos version: 4.0 (RHEL 8.3+ / RHEL 9). The role uses the
#     'sos report' subcommand syntax and flags (--clean, --low-priority,
#     --journal-size, etc.) introduced in sos 4.0. Early RHEL 8 (8.0-8.2)
#     shipped sos 3.x and must be updated. RHEL 7 is NOT supported (uses
#     the legacy 'sosreport' command). In OCP modes, the support-tools
#     container always ships sos 4.x, so the version is not a concern.

# Enable data obfuscation (--clean / --mask). When true, sos replaces
# sensitive data (IP addresses, hostnames, MAC addresses, etc.) with
# consistent obfuscated values throughout the report. Recommended before
# uploading reports to external systems or sharing outside the organization.
sos_report_clean: false

# Red Hat support case identifier (--case-id). Embeds the case number in
# the report metadata so support engineers can correlate reports with cases
# automatically. Example: "03456789".
sos_report_case_id: ""

# Limit collection to specific plugins only (--only-plugins). Comma-separated
# list of plugin names. When set, ONLY these plugins run — all others are
# skipped. Use 'sos report -l' on the target host to list available plugins.
# Example: "networking,filesys,logs".
# ⚠️  In OCP modes the role always enables openshift-specific plugins
#     (-e openshift, crio, podman, etc.); setting this variable overrides
#     that default selection — use with caution in OCP modes.
sos_report_only_plugins: ""

# Skip specific plugins during collection (--skip-plugins). Comma-separated
# list of plugin names to disable. Useful to avoid slow or unusually large
# plugins. Example: "docker,podman".
sos_report_skip_plugins: ""

# Collect only data newer than this date (--since). Format: YYYYMMDD or
# YYYYMMDDHHMMSS. Limits archived files and journals to entries after the
# given date. Useful to narrow reports to a specific incident window.
# Example: "20260801" for data from August 1, 2026 onwards.
sos_report_since: ""

# Maximum size for individual collected log files in MiB (--log-size).
# 0 means do not pass the flag (sos default: 25 MiB).
sos_report_log_size: 0  # MiB — 0 uses the sos default

# Maximum size for collected systemd journals in MiB (--journal-size).
# 0 means do not pass the flag (sos default: 100 MiB).
sos_report_journal_size: 0  # MiB — 0 uses the sos default

# Generate the report with reduced system priority (--low-priority). Uses
# ionice and nice to minimize I/O and CPU impact on the host. Recommended
# for production nodes where sos collection should not compete with
# application workloads.
sos_report_low_priority: true

# Number of threads for parallel data collection (--threads). Higher values
# speed up collection but increase system load. 0 means do not pass the
# flag (sos default: 4 threads).
sos_report_threads: 0  # threads — 0 uses the sos default

# Compression algorithm for the archive (-z). Options: auto, gzip, xz, none.
# 'auto' lets sos choose based on available tools (usually xz).
# Use 'gzip' for faster compression, 'xz' for smaller archives.
sos_report_compression_type: "auto"

# --- Clean/Mask Sub-Options ---
# These options are only effective when sos_report_clean is true.
# They allow fine-grained control over what data gets obfuscated.

# Additional keywords to obfuscate (--keywords). Comma-separated list.
# sos replaces these strings with obfuscated equivalents in all report files.
# Example: "myapp-secret,internal-api-key".
sos_report_clean_keywords: ""

# Additional domain names to obfuscate (--domains). Comma-separated list.
# sos replaces these domains with obfuscated equivalents throughout the report.
# Example: "internal.corp,secret-domain.com".
sos_report_clean_domains: ""

# Usernames to obfuscate (--usernames). Comma-separated list.
# sos replaces these usernames with obfuscated equivalents.
# Example: "admin,deployer,svc-account".
sos_report_clean_usernames: ""

# --- Disk Space Pre-Flight ---
# Minimum free disk space required on the target node's /var/tmp before
# generating a SOS report. The check runs per-node at the start of Stage 03,
# before the (potentially slow) sos collection begins. If the node does not
# meet this threshold, the task fails immediately with a clear message.
# Master/control-plane nodes typically produce 30-40 MB reports;
# workers produce 15-30 MB. The default allows comfortable headroom.
sos_report_min_disk_mb: 500  # megabytes — minimum free space in /var/tmp

# --- Visual Output ---
# Separator character used in banner messages for log readability.
sos_report_separator_char: "*"

# Padding added to banner message text (characters on each side).
sos_report_default_message_padding: 4  # characters
...
