# --- Common: Cleanup SOS Report from target node (shared by standard and ocp_ssh modes) ---
---
- name: "[Common - Cleanup] | 0.0) Print execution status"
  ansible.builtin.debug:
    msg:
      - "{{ sos_report_separator_char * (message_text | length + sos_report_default_message_padding) | int }}"
      - " {{ message_text }} "
      - "{{ sos_report_separator_char * (message_text | length + sos_report_default_message_padding) | int }}"
  vars:
    message_text: "Starting Cleanup — Remove SOS Report from Target Node"

# Only the archive generated by this run (and its checksum file) is removed.
# Other sosreport archives in sos_report_tmp_dir may belong to the customer or
# to concurrent runs. sos_report_location is unset when generate failed before
# printing the archive path, in which case there is nothing of ours to remove.
- name: "[Common - Cleanup] | 0.1) Delete the SOS Report generated by this run"
  vars:
    __sos_report_path: "{{ sos_report_location | default('') }}"
  loop: "{{ [__sos_report_path, __sos_report_path ~ '.sha256'] if __sos_report_path | length > 0 else [] }}"
  loop_control:
    label: "{{ item | basename }}"
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  register: __sos_reports

- name: "[Common - Cleanup] | 0.2) Print completion status"
  ansible.builtin.debug:
    msg:
      - "{{ sos_report_separator_char * (message_text | length + sos_report_default_message_padding) | int }}"
      - " {{ message_text }} "
      - "{{ sos_report_separator_char * (message_text | length + sos_report_default_message_padding) | int }}"
  vars:
    message_text: >-
      Cleanup Completed — {{ __sos_reports.results | default([]) | selectattr('changed') | list | length }}
      file(s) removed from target node
...
