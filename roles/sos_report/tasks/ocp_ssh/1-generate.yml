# --- OCP SSH Mode: Generate SOS Report on RHCOS nodes via support-tools container ---
# Reference KCS: https://access.redhat.com/solutions/3820762
#
# On RHCOS nodes, the 'sos' package is not installed directly.
# Instead, we use the support-tools container image (same as 'toolbox' uses)
# to run 'sos report' with OCP-specific plugins enabled.
#
# The container mounts the host's root filesystem at /host, and sos report
# writes to /host/var/tmp/ (which maps to /var/tmp/ on the host).
---
- name: "[STAGE 01 - OCP SSH Generate] | 1.0) Print execution status"
  ansible.builtin.debug:
    msg:
      - "{{ sos_report_separator_char * (message_text | length + sos_report_default_message_padding) | int }}"
      - " {{ message_text }} "
      - "{{ sos_report_separator_char * (message_text | length + sos_report_default_message_padding) | int }}"
  vars:
    message_text: "Starting OCP SSH Generate — Run SOS Report via support-tools Container"

- name: "[STAGE 01 - OCP SSH Generate] | 1.1) Gather needed facts"
  ansible.builtin.setup:
    filter:
      - 'ansible_user_id'
      - 'ansible_fqdn'

# --- Disk space pre-flight: verify /var/tmp has enough room for the SOS report ---
# Runs on the RHCOS node via SSH before the slow support-tools container collection.
# No Ansible module reports free disk space without full gather_facts;
# a targeted 'df' is cheaper and consistent with the other mode checks.
- name: "[STAGE 01 - OCP SSH Generate] | 1.1.1) Check available disk space on node (/var/tmp)" # noqa: var-naming[no-role-prefix]
  ansible.builtin.command: df -P /var/tmp
  register: __sos_report_disk_raw
  changed_when: false

- name: "[STAGE 01 - OCP SSH Generate] | 1.1.2) Assert sufficient disk space on node"
  vars:
    __avail_kb: "{{ __sos_report_disk_raw.stdout_lines[1].split()[3] }}"
  ansible.builtin.assert:
    that:
      - __avail_kb | int > (sos_report_min_disk_mb | int * 1024)
    fail_msg: >-
      ❌ FAILED! Oh. No! => Insufficient disk space on '{{ inventory_hostname }}'.
      Available: {{ ((__avail_kb | int) / 1024) | round(0) | int }} MB
      in /var/tmp, required: {{ sos_report_min_disk_mb }} MB
      (sos_report_min_disk_mb). Free up space or lower the threshold
      with '-e sos_report_min_disk_mb=<value>'.
    success_msg: >-
      ✅ PASSED! Oh. Yes! => Node '{{ inventory_hostname }}' has
      {{ ((__avail_kb | int) / 1024) | round(0) | int }} MB
      free in /var/tmp (minimum: {{ sos_report_min_disk_mb }} MB).

- name: "[STAGE 01 - OCP SSH Generate] | 1.2) Generate SOS Report via support-tools container" # noqa: var-naming[no-role-prefix]
  register: __sos_report_output
  changed_when: __sos_report_output.rc == 0
  become: true
  async: 3600  # seconds (60 minutes) — support-tools container may take longer
  poll: 15  # seconds — check interval
  ansible.builtin.command: >
    podman run --rm --privileged
      --authfile={{ sos_report_ocp_authfile }}
      --ipc=host --net=host --pid=host
      -e HOST=/host -e NAME=sos-toolbox-{{ inventory_hostname | lower }}
      -e IMAGE={{ sos_report_ocp_support_tools_image }}
      -v /run:/run
      -v /var/log:/var/log
      -v /etc/machine-id:/etc/machine-id
      -v /etc/localtime:/etc/localtime
      -v /:/host
      {{ sos_report_ocp_support_tools_image }}
      sos report --batch
        -e openshift -e openshift_ovn -e openvswitch -e podman -e crio
        -k crio.all=on -k crio.logs=on
        -k podman.all=on -k podman.logs=on
        -k networking.ethtool-namespaces=off
        {% if sos_report_ocp_all_logs | bool %}--all-logs{% endif %}
        --plugin-timeout={{ sos_report_ocp_plugin_timeout }}
        {% if sos_report_clean | bool %}--clean{% endif %}
        {% if sos_report_case_id | length > 0 %}--case-id={{ sos_report_case_id }}{% endif %}
        {% if sos_report_only_plugins | length > 0 %}--only-plugins={{ sos_report_only_plugins }}{% endif %}
        {% if sos_report_skip_plugins | length > 0 %}--skip-plugins={{ sos_report_skip_plugins }}{% endif %}
        {% if sos_report_since | length > 0 %}--since={{ sos_report_since }}{% endif %}
        {% if sos_report_log_size | int > 0 %}--log-size={{ sos_report_log_size }}{% endif %}
        {% if sos_report_journal_size | int > 0 %}--journal-size={{ sos_report_journal_size }}{% endif %}
        {% if sos_report_low_priority | bool %}--low-priority{% endif %}
        {% if sos_report_threads | int > 0 %}--threads={{ sos_report_threads }}{% endif %}
        {% if sos_report_compression_type != 'auto' %}-z {{ sos_report_compression_type }}{% endif %}
        {% if sos_report_clean | bool and sos_report_clean_keywords | length > 0 %}--keywords={{ sos_report_clean_keywords }}{% endif %}
        {% if sos_report_clean | bool and sos_report_clean_domains | length > 0 %}--domains={{ sos_report_clean_domains }}{% endif %}
        {% if sos_report_clean | bool and sos_report_clean_usernames | length > 0 %}--usernames={{ sos_report_clean_usernames }}{% endif %}
        --label={{ inventory_hostname | lower }}

- name: "[STAGE 01 - OCP SSH Generate] | 1.3) Set SOS Report location variable"
  ansible.builtin.set_fact:
    sos_report_location: "{{ __sos_report_output.stdout | regex_search('/host/var/tmp/sosreport-.*.tar.xz') | regex_replace('^/host', '') | regex_replace('\\t', '') }}"

- name: "[STAGE 01 - OCP SSH Generate] | 1.4) Assert SOS Report was generated successfully"
  ansible.builtin.assert:
    that:
      - sos_report_location is defined
      - sos_report_location | length > 0
    fail_msg: >-
      ❌ FAILED! Oh. No! => Could not locate the generated SOS Report in the command output.
      The support-tools container may have failed to generate the report.
      Output: {{ __sos_report_output.stdout | default('No output') }}
      Stderr: {{ __sos_report_output.stderr | default('No errors') }}
    success_msg: >-
      ✅ PASSED! Oh. Yes! => SOS Report generated at: {{ sos_report_location }}

- name: "[STAGE 01 - OCP SSH Generate] | 1.5) Print completion status"
  ansible.builtin.debug:
    msg:
      - "{{ sos_report_separator_char * (message_text | length + sos_report_default_message_padding) | int }}"
      - " {{ message_text }} "
      - "{{ sos_report_separator_char * (message_text | length + sos_report_default_message_padding) | int }}"
  vars:
    message_text: "OCP SSH Generate Completed — SOS Report Created on {{ inventory_hostname }}"
...
