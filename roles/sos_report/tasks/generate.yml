---
- name: Generate | Gather needed facts
  ansible.builtin.setup:
    filter:
      - 'ansible_user_id'
      - 'ansible_fqdn'

- name: Generate | Generate the SOS Report
  register: __sos_report_output
  changed_when: __sos_report_output.rc == 0
  become: true
  async: 1800 # Allow up to 30 minutes for sos to run
  poll: 10 # Check every 10 seconds
  ansible.builtin.command: >
    sos report --batch
      {% if sos_report_aap_containerized | bool %} -k aap_containerized.username={{ ansible_user_id }}{% endif %}
      {% if sos_report_mask | bool %} --mask{% endif %}
      {% if sos_report_all_logs | bool %} --all-logs{% endif %}
      {% if sos_report_dry_run | bool %} --dry-run{% endif %}
      {% if sos_report_estimate_only | bool %} --estimate-only{% endif %}
      {% if sos_report_threads | bool and sos_report_threads_number | bool %} --threads "{{ sos_report_threads_number }}"{% endif %}
      --label={{ inventory_hostname | lower }}

- name: Generate | Set SOS Report location variable
  ansible.builtin.set_fact:
    sos_report_location: "{{ __sos_report_output.stdout | regex_search('.*/sosreport-.*.tar.xz') | regex_replace('\\t', '') }}"

- name: Generate | View sosreport location on remote nodes
  ansible.builtin.debug:
    msg: "Server-side SOS Report located at: {{ sos_report_location }}"
...
