---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Verify sosreport destination directory exists # noqa: var-naming[no-role-prefix]
      ansible.builtin.stat:
        path: "{{ sos_report_dest | default('/tmp/sos_reports_test') }}"
      register: __dest_stat
      failed_when: false

    - name: Check if sos package is installed # noqa: var-naming[no-role-prefix]
      ansible.builtin.dnf:
        list: sos
      register: __sos_pkg_check
      failed_when: false
      changed_when: false

    - name: Display verification results
      ansible.builtin.debug:
        msg:
          - "SOS package installed: {{ __sos_pkg_check.results | default([]) | length > 0 }}"
          - "Destination directory exists: {{ __dest_stat.stat.exists | default(false) }}"
...
