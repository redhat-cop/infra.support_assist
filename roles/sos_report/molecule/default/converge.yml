---
- name: Converge
  hosts: all
  tasks:
    # Path is relative to this playbook; Molecule does not put repo roles/ on ANSIBLE_ROLES_PATH for import_role by name.
    - name: Converge sos_report role
      ansible.builtin.import_role:
        name: ../..
      vars:
        sos_report_dest: "/tmp/sos_reports_test"
        sos_report_cleanup: false
...
