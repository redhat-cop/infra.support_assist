---
- name: Converge
  hosts: all
  tasks:
    # Role name must match Molecule roles_path (roles/); relative `../..` does not resolve in CI.
    - name: Converge sos_report role
      ansible.builtin.import_role:
        name: sos_report
      vars:
        sos_report_dest: "/tmp/sos_reports_test"
        sos_report_cleanup: false
...
