---
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Install sudo (required for become tasks in containers)
      ansible.builtin.dnf:
        name: sudo
        state: present

    - name: Configure passwordless sudo for root (safe in test containers)
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        line: "root ALL=(ALL) NOPASSWD: ALL"
        regexp: "^root.*NOPASSWD"
        state: present
        validate: "visudo -cf %s"

    - name: Update package cache
      ansible.builtin.dnf:
        update_cache: true

    # Matches converge sos_report_dest; verify asserts this path on the controller exists.
    - name: Ensure controller destination path for sos_report tests
      ansible.builtin.file:
        path: /tmp/sos_reports_test
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true
...
