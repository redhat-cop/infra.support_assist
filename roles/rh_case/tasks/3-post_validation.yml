# --- Post Validation Tasks for Red Hat Support Case Creation Role ---
---
- name: Post Validation | Print on screen role execution status.
  ansible.builtin.debug:
    msg:
      - "{{ rh_case_separator_char * (message_text | length + rh_case_default_message_padding) | int }}"
      - " {{ message_text }} "
      - "{{ rh_case_separator_char * (message_text | length + rh_case_default_message_padding) | int }}"
  vars:
    message_text: "Executing Post-Case Creation Validation Steps and Fact Setting"
  run_once: true

# REST v3 primary: server returns HTTP 200/201 with caseNumber at the top level.
# GraphQL fallback: server returns HTTP 200 with data nested under redhat_support_uiapi.CaseCreate.
# __rh_case_created_via_rest_v3 (bool set by 2-create_case.yml) selects which format to parse.

- name: "Post Validation | Verify REST v3 response and case creation success (primary)"
  when:
    - __rh_case_created_via_rest_v3 | default(false) | bool
  ansible.builtin.assert:
    that:
      - case_creation_result is defined
      - case_creation_result.status | int in [200, 201]
      - case_creation_result.json.caseNumber is defined
      - case_creation_result.json.caseNumber | length > 0
    fail_msg: >-
      FAILED! REST v3 case creation response missing caseNumber.
      HTTP Status: {{ case_creation_result.status | default('N/A') }}
      Response: {{ case_creation_result.content | default('N/A') | truncate(400) }}
    success_msg: >-
      PASSED! Case created via REST v3.
      Case Number: {{ case_creation_result.json.caseNumber }}
  run_once: true

- name: "Post Validation | Extract Case Number and set as global fact (primary)" # noqa: var-naming[no-role-prefix]
  when:
    - __rh_case_created_via_rest_v3 | default(false) | bool
  ansible.builtin.set_fact:
    new_case_id: "{{ case_creation_result.json.caseNumber }}"
  run_once: true

# GraphQL fallback: returns HTTP 200 with data nested under redhat_support_uiapi.CaseCreate.
# Schema: https://access.redhat.com/articles/7146073
- name: "Post Validation | Verify GraphQL response and case creation success (fallback)"
  when:
    - not (__rh_case_created_via_rest_v3 | default(false) | bool)
  ansible.builtin.assert:
    that:
      - case_creation_result is defined
      - case_creation_result.status == 200
      - case_creation_result.json.data.redhat_support_uiapi.CaseCreate is defined
      - >-
        case_creation_result.json.data.redhat_support_uiapi.CaseCreate.RedHatSupportRecord.CaseNumber__c.value
        | default('') | length > 0
    fail_msg: >-
      FAILED! GraphQL case creation failed!
      HTTP Status: {{ case_creation_result.status | default('N/A') }}
      Errors: {{ case_creation_result.json.errors | default([]) | to_json }}
      Response: {{ case_creation_result.content | default('N/A') | truncate(400) }}
    success_msg: >-
      PASSED! Case created via GraphQL fallback.
      Case Number: {{ case_creation_result.json.data.redhat_support_uiapi.CaseCreate.RedHatSupportRecord.CaseNumber__c.value }}
  run_once: true

- name: "Post Validation | Extract Case Number and set as global fact (fallback)" # noqa: var-naming[no-role-prefix]
  when:
    - not (__rh_case_created_via_rest_v3 | default(false) | bool)
  ansible.builtin.set_fact:
    new_case_id: >-
      {{ case_creation_result.json.data.redhat_support_uiapi.CaseCreate.RedHatSupportRecord.CaseNumber__c.value }}
  run_once: true

- name: Post Validation | Print on screen role completion status.
  ansible.builtin.debug:
    msg:
      - "{{ rh_case_separator_char * (message_text | length + rh_case_default_message_padding) | int }}"
      - " {{ message_text }} "
      - "{{ rh_case_separator_char * (message_text | length + rh_case_default_message_padding) | int }}"
  vars:
    message_text: "Completed Post-Validation for Red Hat Support Case Creation"
  run_once: true

...
