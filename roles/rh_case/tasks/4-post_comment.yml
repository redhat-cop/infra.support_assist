---
- name: Comment | Notify start of comment update for case {{ new_case_id }}
  ansible.builtin.debug:
    msg:
      - "{{ rh_case_separator_char * (message_text | length + rh_case_default_message_padding) | int }}"
      - " {{ message_text }} "
      - "{{ rh_case_separator_char * (message_text | length + rh_case_default_message_padding) | int }}"
  vars:
    message_text: "Starting Comment Update for Case ID {{ new_case_id }}"
  run_once: true

- name: Comment | Render support case comment from Jinja template # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    case_comment: "{{ lookup('template', 'support_case_comment.j2') }}"
  run_once: true

# REST v3 primary with GraphQL fallback.
# Primary: POST /v3/cases/{new_case_id}/comments — contentType is required by the v3 spec.
# Fallback: GraphQL CaseComment__cCreate — requires rh_case_sf_case_id.
#   rh_case_sf_case_id is set when the GraphQL CREATE fallback ran (REST v3 CREATE failed).
#   If REST v3 CREATE succeeded, rh_case_sf_case_id is not available here — the GraphQL
#   fallback is skipped and a warning is emitted instead.
# note: case_id is not yet defined at this point in the flow (set later in main.yml);
#       new_case_id (set by 3-post_validation.yml) is used throughout this task file.

- name: "Comment | POST REST v3 post-create comment (primary)" # noqa: var-naming[no-role-prefix]
  ansible.builtin.uri:
    url: "{{ rh_case_api_v3_base_url }}/support/v3/cases/{{ new_case_id }}/comments"
    method: POST
    headers:
      Authorization: "Bearer {{ rh_token_refresh_api_access_token }}"
      Content-Type: "application/json"
      Accept: "application/json"
    body_format: json
    body:
      commentBody: "{{ case_comment }}"
      contentType: "plaintext"
    status_code:
      - 200
      - 201
    return_content: true
    validate_certs: true
    use_proxy: "{{ rh_case_use_proxy }}"
  register: __rh_comment_result_v3_rest
  failed_when: false
  no_log: "{{ rh_case_no_log }}"
  environment:
    https_proxy: "{{ rh_case_http_proxy }}"
    http_proxy: "{{ rh_case_http_proxy }}"
  run_once: true

- name: "Comment | Set REST v3 post-create comment success flag" # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    __rh_post_comment_via_rest_v3: >-
      {{ (__rh_comment_result_v3_rest.status | default(0)) | int in [200, 201] }}
  run_once: true

# GraphQL fallback — only attempted when rh_case_sf_case_id is available.
# rh_case_sf_case_id is set by 2-create_case.yml when the GraphQL CREATE fallback ran.
# If REST v3 CREATE was the primary path, rh_case_sf_case_id is not set and this block
# is skipped; a warning is emitted and the post-create comment is not delivered.
- name: "Comment | Build GraphQL post-create comment payload (v3 fallback)" # noqa: var-naming[no-role-prefix]
  when:
    - not (__rh_post_comment_via_rest_v3 | default(false) | bool)
    - rh_case_sf_case_id is defined and rh_case_sf_case_id | length > 0
  ansible.builtin.set_fact:
    __rh_comment_v3_payload:
      query: "{{ lookup('template', 'graphql/create_case_comment.graphql.j2') }}"
      variables:
        input:
          RedHatSupportCaseComment__c:
            Case__c: "{{ rh_case_sf_case_id }}"
            Body__c: "{{ case_comment }}"
            Visibility__c: "Public"
  run_once: true

- name: "Comment | POST GraphQL post-create comment (v3 fallback)" # noqa: var-naming[no-role-prefix]
  when:
    - not (__rh_post_comment_via_rest_v3 | default(false) | bool)
    - rh_case_sf_case_id is defined and rh_case_sf_case_id | length > 0
  ansible.builtin.uri:
    url: "{{ rh_case_graphql_url }}"
    method: POST
    headers:
      Authorization: "Bearer {{ rh_token_refresh_api_access_token }}"
      Content-Type: "application/json"
      Accept: "application/json"
      Accept-Encoding: "identity"
      apollographql-client-name: "{{ rh_case_graphql_client_name }}"
      apollographql-client-version: "{{ rh_case_graphql_client_version }}"
    body_format: json
    body: "{{ __rh_comment_v3_payload }}"
    status_code:
      - 200
    return_content: true
    validate_certs: true
    use_proxy: "{{ rh_case_use_proxy }}"
  register: __rh_comment_result_v3_graphql
  no_log: "{{ rh_case_no_log }}"
  environment:
    https_proxy: "{{ rh_case_http_proxy }}"
    http_proxy: "{{ rh_case_http_proxy }}"
  run_once: true

# Emits a non-fatal warning when REST v3 failed and GraphQL fallback was not available.
# The case was created successfully — only this optional initial comment was not posted.
- name: "Comment | Warn if post-create comment could not be delivered (v3)" # noqa: var-naming[no-role-prefix]
  when:
    - not (__rh_post_comment_via_rest_v3 | default(false) | bool)
    - rh_case_sf_case_id is not defined or rh_case_sf_case_id | default('') | length == 0
  ansible.builtin.debug:
    msg: >-
      ⚠️ Post-create comment was not posted to case {{ new_case_id }}.
      REST v3 returned HTTP {{ __rh_comment_result_v3_rest.status | default('N/A') }}.
      GraphQL fallback skipped — SFDC Case Id not available (case was created via REST v3 primary).
  run_once: true

- name: "Comment | Consolidate result into __comment_api_result" # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    __comment_api_result: >-
      {{ __rh_comment_result_v3_rest if (__rh_post_comment_via_rest_v3 | default(false) | bool)
         else __rh_comment_result_v3_graphql | default({}) }}
  run_once: true

- name: "Comment | Assert post-create comment succeeded"
  ansible.builtin.assert:
    that:
      - >-
        (__rh_post_comment_via_rest_v3 | default(false) | bool) or
        (rh_case_sf_case_id is not defined or rh_case_sf_case_id | default('') | length == 0) or
        (
          __comment_api_result.status | default(0) | int == 200 and
          (__comment_api_result.json.errors | default([])) | length == 0 and
          __comment_api_result.json.data.redhat_support_uiapi.CaseComment__cCreate is defined
        )
    success_msg: >-
      PASSED! Oh, Yes! => Comment added successfully to case {{ new_case_id }}!
      HTTP Status: {{ __comment_api_result.status | default('N/A') }}.
      Proceeding to next step...
    fail_msg: >-
      FAILED! Oh, No! => Failed to add post-create comment to case {{ new_case_id }}!
      REST v3 — HTTP {{ __rh_comment_result_v3_rest.status | default('N/A') }}
      GraphQL — HTTP {{ __rh_comment_result_v3_graphql.status | default('N/A') }}
      GraphQL errors: {{ __rh_comment_result_v3_graphql.json.errors | default([]) | to_json }}

- name: Comment | Notify success after comment addition
  ansible.builtin.debug:
    msg: "HANDLER: Triggering final update summary display at the end for case {{ new_case_id }}..."
  changed_when: true
  notify: "DisplayCaseUpdateSummaryTrigger"

...
