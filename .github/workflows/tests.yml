---
name: "CI"

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [devel]
  # Merge queue runs execute in this repo's context, so secrets are available
  # even for PRs from forks. This is where the full suite is enforced.
  merge_group:
    branches: [devel]
  workflow_dispatch:
  # TO-DO: Below is an example cron scheduler. Uncomment and tweak it as per your requirement
  # schedule:
    # - cron: '0 0 * * *'

jobs:
  # Secrets are not exposed to pull_request runs from forks or Dependabot.
  # Jobs that need CRC_PUBLISH_KEY are skipped there; all_green still requires
  # them to pass in the merge queue (merge_group) and on workflow_dispatch.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_crc: ${{ steps.check.outputs.has_crc }}
    steps:
      - id: check
        env:
          CRC_PUBLISH_KEY: ${{ secrets.CRC_PUBLISH_KEY }}
        run: |
          if [ -n "$CRC_PUBLISH_KEY" ]; then
            echo "has_crc=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_crc=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CRC_PUBLISH_KEY is not available (fork/Dependabot PR). Sanity, unit and molecule tests will be skipped here and must pass in the merge queue."
          fi
  changelog:
    uses: ansible/ansible-content-actions/.github/workflows/changelog.yaml@main
    if: github.event_name == 'pull_request'
  build-import:
    uses: ansible/ansible-content-actions/.github/workflows/build_import.yaml@main
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: tcort/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'
          check-modified-files-only: 'yes'
          config-file: '.mlc_config.json'
          base-branch: ${{ github.base_ref || (github.event_name == 'merge_group' && 'devel') || github.ref_name || 'main' }}
  ansible-lint:
    uses: ansible/ansible-content-actions/.github/workflows/ansible_lint.yaml@main
  sanity:
    needs:
      - check-secrets
    if: needs.check-secrets.outputs.has_crc == 'true'
    # Local workflow: certified hub env must live on real jobs (not on caller-only `uses:` jobs).
    uses: ./.github/workflows/tests_sanity.yml
    with:
      # AAP floor alignment: ansible-core 2.16 + Python 3.12 (see meta/runtime.yml)
      extra_matrix_entries: >-
        [{"description":"Sanity tests using ansible-core 2.16 and python 3.12","factors":["sanity","py3.12","2.16"],"name":"sanity-py3.12-2.16","python":"3.12"}]
    secrets:
      crc_publish_key: ${{ secrets.CRC_PUBLISH_KEY }}
  unit-galaxy:
    needs:
      - ansible-lint
      - check-secrets
    if: needs.check-secrets.outputs.has_crc == 'true'
    uses: ./.github/workflows/tests_unit.yml
    with:
      extra_matrix_entries: >-
        [{"description":"Unit tests using ansible-core 2.16 and python 3.12","factors":["unit","py3.12","2.16"],"name":"unit-py3.12-2.16","python":"3.12"}]
    secrets:
      crc_publish_key: ${{ secrets.CRC_PUBLISH_KEY }}
  molecule:
    name: Molecule Tests
    needs:
      - check-secrets
    if: needs.check-secrets.outputs.has_crc == 'true'
    runs-on: ubuntu-latest
    env:
      ANSIBLE_GALAXY_SERVER_LIST: certified,galaxy
      ANSIBLE_GALAXY_SERVER_CERTIFIED_URL: https://console.redhat.com/api/automation-hub/content/published/
      ANSIBLE_GALAXY_SERVER_CERTIFIED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
      ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN: ${{ secrets.CRC_PUBLISH_KEY }}
      ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com/api/
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        role:
          - aap_api_gather
          - aap_api_token
          - ocp_must_gather
          - rh_case
          - rh_token_refresh
          - sos_report
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          # Configure podman for rootless operation
          podman system migrate || true
          # Enable lingering for the runner user to allow systemd user services
          sudo loginctl enable-linger $USER || true
          # Start podman socket service
          systemctl --user enable podman.socket || true
          systemctl --user start podman.socket || true
          # Wait a moment for socket to be ready
          sleep 2
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer molecule-plugins[podman] over the deprecated molecule-podman
          # package (see test-requirements.txt). molecule-plugins >=25.8.12
          # works with ansible-core 2.19+ boolean conditionals.
          pip install -r test-requirements.txt
      - name: Install collection dependencies
        run: |
          ansible-galaxy collection install -r collections/requirements.yml
      - name: Show installed Ansible / Molecule versions
        run: |
          ansible --version
          molecule --version
          python -c "import importlib.metadata as m; print('molecule-plugins', m.version('molecule-plugins'))"
      - name: Verify Podman is available
        run: |
          podman --version
          podman info
      - name: Run molecule test
        working-directory: roles/${{ matrix.role }}
        run: |
          # Workaround for molecule schema validation when the podman driver
          # does not ship a JSON schema. Prefer the wrapper; fall back to
          # create/converge/verify/destroy when validation warnings abort `test`.
          set +e
          WRAPPER_SCRIPT="${{ github.workspace }}/.github/scripts/molecule-wrapper.py"
          python3 "$WRAPPER_SCRIPT" test 2>&1 | tee /tmp/molecule-output.log
          WRAPPER_EXIT=${PIPESTATUS[0]}

          # If wrapper failed with validation error, try individual commands
          if [ $WRAPPER_EXIT -ne 0 ]; then
            if grep -q "does not provide a schema\|Failed to validate" /tmp/molecule-output.log; then
              echo "⚠️  Schema validation issue detected, running commands individually..."
              python3 "$WRAPPER_SCRIPT" create && \
              python3 "$WRAPPER_SCRIPT" converge && \
              python3 "$WRAPPER_SCRIPT" verify && \
              python3 "$WRAPPER_SCRIPT" destroy
              exit $?
            else
              exit $WRAPPER_EXIT
            fi
          fi
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
  all_green:
    if: ${{ always() }}
    needs:
      - check-secrets
      - changelog
      - build-import
      - sanity
      - unit-galaxy
      - ansible-lint
      - molecule
      - markdown-link-check
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_CRC: ${{ needs.check-secrets.outputs.has_crc }}
          CHECK_SECRETS: ${{ needs.check-secrets.result }}
          CHANGELOG: ${{ needs.changelog.result }}
          BUILD_IMPORT: ${{ needs.build-import.result }}
          ANSIBLE_LINT: ${{ needs.ansible-lint.result }}
          MARKDOWN_LINK_CHECK: ${{ needs.markdown-link-check.result }}
          SANITY: ${{ needs.sanity.result }}
          UNIT_GALAXY: ${{ needs.unit-galaxy.result }}
          MOLECULE: ${{ needs.molecule.result }}
        run: |
          rc=0
          check_not_failed() {
            echo "$1: $2"
            case "$2" in
              failure|cancelled) echo "::error::$1 $2"; rc=1 ;;
            esac
          }
          check_not_failed check-secrets "$CHECK_SECRETS"
          check_not_failed changelog "$CHANGELOG"
          check_not_failed build-import "$BUILD_IMPORT"
          check_not_failed ansible-lint "$ANSIBLE_LINT"
          check_not_failed markdown-link-check "$MARKDOWN_LINK_CHECK"
          check_not_failed sanity "$SANITY"
          check_not_failed unit-galaxy "$UNIT_GALAXY"
          check_not_failed molecule "$MOLECULE"

          # Secret-dependent suites may only be skipped on pull_request runs that
          # genuinely lack the secret. Everywhere else (merge queue, manual runs,
          # same-repo PRs) they must have actually run and succeeded.
          require_success() {
            if [ "$2" != "success" ]; then
              echo "::error::$1 must succeed for $EVENT_NAME (got '$2'; has_crc=$HAS_CRC)"
              rc=1
            fi
          }
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$HAS_CRC" = "true" ]; then
            require_success sanity "$SANITY"
            require_success unit-galaxy "$UNIT_GALAXY"
            require_success molecule "$MOLECULE"
          else
            echo "::warning::Sanity/unit/molecule skipped (no CRC_PUBLISH_KEY). They will be enforced in the merge queue."
          fi
          exit $rc
