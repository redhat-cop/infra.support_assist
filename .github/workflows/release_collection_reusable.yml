---
# Shared release pipeline: changelog branch, GitHub Release, Galaxy/AH publish, merge, notify.
# Callers supply version outputs and whether major-release approval should run (schedule vs workflow_dispatch).
name: Release collection (reusable)

on:
  workflow_call:
    inputs:
      collection_version:
        required: true
        type: string
      change_level:
        required: true
        type: string
      change_present:
        required: true
        type: string
      skip_major_release_gate:
        description: When true, skip major-release environment (same as caller workflow_dispatch).
        required: true
        type: boolean

permissions:
  contents: read

env:
  COLLECTION_NAMESPACE: infra
  COLLECTION_NAME: support_assist
  COLLECTION_REPO: https://github.com/redhat-cop/infra.support_assist/

jobs:
  major_release_gate:
    name: Major Release Approval
    if: >-
      inputs.change_level == 'major'
      && inputs.change_present != 'false'
      && !inputs.skip_major_release_gate
    runs-on: ubuntu-latest
    environment: major-release
    steps:
      - name: Confirm major release
        run: |
          echo "::notice::Major release ${{ inputs.collection_version }} has been approved."

  changelog:
    name: Generate Changelog
    needs:
      - major_release_gate
    if: >-
      always()
      && inputs.change_present != 'false'
      && (needs.major_release_gate.result == 'success' || needs.major_release_gate.result == 'skipped')
      && !(needs.major_release_gate.result == 'skipped' && inputs.change_level == 'major' && !inputs.skip_major_release_gate)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate GH_WORKFLOW_KEY secret
        env:
          TOKEN: ${{ secrets.GH_WORKFLOW_KEY }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GH_WORKFLOW_KEY secret is not set. This is required for pushing release branches."
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: "${{ secrets.GH_WORKFLOW_KEY }}"

      - name: Create release branch
        run: |
          BRANCH="release/${{ inputs.collection_version }}"
          git checkout -B "${BRANCH}"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install --upgrade "ansible-core>=2.16,<2.19" antsibull-changelog

      - name: Update galaxy.yml version for changelog (remove -devel)
        run: |
          sed -i "s/^version:.*/version: ${{ inputs.collection_version }}/" galaxy.yml

      - name: Generate changelog
        run: antsibull-changelog release --verbose --version ${{ inputs.collection_version }}

      - name: Commit and push to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[AUTO] Update changelog ${{ inputs.collection_version }}"
          git push origin "release/${{ inputs.collection_version }}"

  create_github_release:
    name: Create GitHub Release
    needs:
      - changelog
    if: ${{ !cancelled() && needs.changelog.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.collection_version }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, updating it."
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
          else
            gh release create "$TAG" --repo "${{ github.repository }}" --generate-notes --draft
          fi

  release_galaxy:
    name: Publish to Galaxy
    needs:
      - upload_tarball
    if: ${{ !cancelled() && needs.upload_tarball.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: release/${{ inputs.collection_version }}

      - name: Build the collection
        run: ansible-galaxy collection build -v --force

      - name: Publish the collection on Galaxy
        run: |
          TARBALL=$(ls -1 ./*.tar.gz)
          ansible-galaxy collection publish "${TARBALL}" --api-key "${{ secrets.GALAXY_INFRA_KEY }}"

  release_ah:
    name: Publish to Automation Hub
    needs:
      - upload_tarball
    if: ${{ !cancelled() && needs.upload_tarball.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: release
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: release/${{ inputs.collection_version }}

      - name: Set up Ansible
        run: pip install --upgrade "ansible-core>=2.16"

      - name: Build the collection
        run: ansible-galaxy collection build -v --force

      - name: Publish to Automation Hub
        env:
          ANSIBLE_GALAXY_SERVER_LIST: rh_automation_hub
          ANSIBLE_GALAXY_SERVER_RH_AUTOMATION_HUB_URL: https://cloud.redhat.com/api/automation-hub/
          ANSIBLE_GALAXY_SERVER_RH_AUTOMATION_HUB_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
          ANSIBLE_GALAXY_SERVER_RH_AUTOMATION_HUB_TOKEN: ${{ secrets.CRC_PUBLISH_KEY }}
        run: |
          TARBALL=$(ls -1 ./*.tar.gz | head -n1)
          ansible-galaxy collection publish "${TARBALL}"

  release_check:
    name: Verify Releases
    needs:
      - release_galaxy
      - release_ah
    if: ${{ !cancelled() && needs.release_galaxy.result == 'success' && needs.release_ah.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "All releases completed successfully"

  upload_tarball:
    name: Upload Tarball to Release
    needs:
      - create_github_release
    if: ${{ !cancelled() && needs.create_github_release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: release/${{ inputs.collection_version }}

      - name: Build collection tarball
        run: ansible-galaxy collection build -v --force

      - name: Upload tarball and publish release
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_KEY }}
          TAG: ${{ inputs.collection_version }}
        run: |
          for tarball in ${{ env.COLLECTION_NAMESPACE }}-${{ env.COLLECTION_NAME }}*.tar.gz; do
            ASSET_NAME=$(basename "$tarball")
            EXISTING=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq ".assets[].name" 2>/dev/null || true)
            if echo "$EXISTING" | grep -qF "$ASSET_NAME"; then
              echo "::notice::Asset $ASSET_NAME already exists on release $TAG, deleting before re-upload."
              gh release delete-asset "$TAG" "$ASSET_NAME" --repo "${{ github.repository }}" --yes
            fi
            gh release upload "$TAG" "$tarball" --repo "${{ github.repository }}"
          done
          gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest

  merge_release:
    name: Merge Release Branch
    needs:
      - release_check
      - upload_tarball
    if: ${{ !cancelled() && needs.release_check.result == 'success' && needs.upload_tarball.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: release/${{ inputs.collection_version }}

      - name: Create and merge release PR
        run: |
          gh pr create \
            --base devel \
            --head "release/${{ inputs.collection_version }}" \
            --title "[RELEASE] Update changelog ${{ inputs.collection_version }}" \
            --body "Updated with changelog for release ${{ inputs.collection_version }}"
          gh pr merge "release/${{ inputs.collection_version }}" --rebase --admin
        env:
          GH_TOKEN: ${{ secrets.GH_WORKFLOW_KEY }}

  # deploy_ee:
  #   name: Build Execution Environment
  #   needs: merge_release
  #   if: ${{ !cancelled() && needs.merge_release.result == 'success' }}
  #   uses: redhat-cop/ansible_collections_tooling/.github/workflows/build_ee.yml@634342818b5d5fa2fa92b2c68c78a2bbe8aa4f10 # main
  #   with:
  #     quay_username: redhat_cop
  #   secrets:
  #     quay_token: ${{ secrets.QUAY_TOKEN }}

  send_message:
    name: Send Matrix Notification
    needs:
      - release_check
    if: ${{ !cancelled() && needs.release_check.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send message to newsbot channel
        uses: fadenb/matrix-chat-message@89baab2b9ea06ffdd5f5b1ca80e9f888c3d7c9d3 # v0.0.6
        with:
          homeserver: "matrix.org"
          token: ${{ secrets.MATRIX_TOKEN }}
          channel: "!pMZboYFCScZJfXmOtH:ansible.im"
          messagetype: "m.text"
          message: |
            @newsbot ${{ env.COLLECTION_NAMESPACE }}.${{ env.COLLECTION_NAME }} ${{ inputs.collection_version }} has been released.
            This Ansible Collection will gather various reports/outputs that are commonly asked for in Red Hat Support Cases, and can optionally
            create the case, and then upload the diagnostics directly to the Support Case Portal.
            Visit ${{ env.COLLECTION_REPO }} For more information and updates.

      # - name: Send message to team channel
      #   uses: fadenb/matrix-chat-message@89baab2b9ea06ffdd5f5b1ca80e9f888c3d7c9d3 # v0.0.6
      #   with:
      #     homeserver: "matrix.org"
      #     token: ${{ secrets.MATRIX_TOKEN }}
      #     channel: "!ccrdinGkMeyakqWzIM:matrix.org"
      #     messagetype: "m.text"
      #     message: |
      #       ${{ env.COLLECTION_NAMESPACE }}.${{ env.COLLECTION_NAME }} ${{ inputs.collection_version }} has been released.
      #       This Ansible Collection will gather various reports/outputs that are commonly asked for in Red Hat Support Cases, and can optionally
      #       create the case, and then upload the diagnostics directly to the Support Case Portal.
      #       Visit ${{ env.COLLECTION_REPO }} For more information and updates.
